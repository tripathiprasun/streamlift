<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Stream download</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f3f5f9; --surface: #ffffff; --ink: #171b24; --muted: #5b6472;
      --line: #e1e5ed; --line-strong: #ccd3df; --hover: #eceff5;
      --brand: #1a73e8; --brand-hover: #1765cc; --brand-soft: #e8f0fe; --brand-text: #1459b8;
      --ok: #137333; --ok-soft: #e6f4ea; --danger: #c5221f; --danger-soft: #fce8e6;
      --warn-ink: #7a4a00; --warn-soft: #fff6dc; --warn-line: #f0d98f;
      --code-bg: #eef1f6;
      --shadow: 0 1px 2px rgba(20, 27, 40, .06), 0 8px 24px rgba(20, 27, 40, .06);
      --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand);
      --i-close: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M6%206l12%2012'/%3E%3Cpath%20d='M18%206L6%2018'/%3E%3C/svg%3E");
      --i-alert: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M12%203.5l9.5%2016.5h-19z'/%3E%3Cpath%20d='M12%2010v4.5'/%3E%3Cpath%20d='M12%2017.4v.1'/%3E%3C/svg%3E");
      --i-check: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Ccircle%20cx='12'%20cy='12'%20r='9'/%3E%3Cpath%20d='M8%2012.3l2.8%202.8%205.2-5.6'/%3E%3C/svg%3E");
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #12151b; --surface: #1b1f27; --ink: #e9edf4; --muted: #9ba5b5;
        --line: #2a303b; --line-strong: #3a4250; --hover: #252b36;
        --brand-soft: #1b2a44; --brand-text: #8ab8ff;
        --ok: #7fd99b; --ok-soft: #173222; --danger: #ff8a84; --danger-soft: #3c1a19;
        --warn-ink: #f2c36b; --warn-soft: #302710; --warn-line: #574415;
        --code-bg: #12151b;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--canvas); }
    body { margin: 0; padding: 32px 16px; min-height: 100vh; background: var(--canvas); color: var(--ink);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }

    .card { max-width: 560px; margin: 0 auto; padding: 20px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: var(--shadow); }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .logo { flex: none; width: 40px; height: 40px; border-radius: 11px; display: block; }
    .titles { min-width: 0; }
    h1 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
    #url { margin-top: 2px; color: var(--muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    #url:empty { display: none; }

    #info { margin: 0 0 14px; }
    #info:not(:empty) { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft);
      color: var(--brand-text); font-size: 12px; font-weight: 600; }

    progress { display: block; width: 100%; height: 8px; border: 0; border-radius: 999px; overflow: hidden;
      -webkit-appearance: none; appearance: none; background: var(--line); }
    progress::-webkit-progress-bar { background: var(--line); border-radius: 999px; }
    progress::-webkit-progress-value { background: var(--brand); border-radius: 999px; transition: width .2s ease; }
    progress::-moz-progress-bar { background: var(--brand); border-radius: 999px; }
    body:has(#status.done) progress::-webkit-progress-value { background: var(--ok); }
    body:has(#status.error) progress::-webkit-progress-value { background: var(--danger); }

    #status { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0 0; color: var(--ink); overflow-wrap: anywhere; }
    #status::before { content: ""; flex: none; width: 16px; height: 16px; margin-top: 3px; box-sizing: border-box;
      border: 2px solid var(--line-strong); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    #status.done, #status.error { font-weight: 600; }
    #status.done { color: var(--ok); }
    #status.error { color: var(--danger); }
    #status.done::before, #status.error::before { border: 0; border-radius: 0; animation: none; background: currentColor;
      -webkit-mask: var(--i-check) center / contain no-repeat; mask: var(--i-check) center / contain no-repeat; }
    #status.error::before { -webkit-mask-image: var(--i-alert); mask-image: var(--i-alert); }
    @keyframes spin { to { transform: rotate(360deg); } }

    #note { margin: 14px 0 0; padding: 9px 12px; border: 1px solid var(--warn-line); border-radius: 10px;
      background: var(--warn-soft); color: var(--warn-ink); font-size: 12.5px; line-height: 1.55; }
    code { padding: 2px 6px; border-radius: 6px; background: var(--code-bg); color: var(--ink); word-break: break-all;
      font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: all; }

    .actions { margin-top: 16px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 14px;
      border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color .12s, border-color .12s, color .12s; }
    button:hover { background: var(--hover); }
    button:focus-visible { outline: none; box-shadow: var(--focus); }
    button::before { content: ""; width: 14px; height: 14px; background: currentColor;
      -webkit-mask: var(--i-close) center / contain no-repeat; mask: var(--i-close) center / contain no-repeat; }
    #cancel:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      #status::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <img class="logo" src="../icons/icon48.png" alt="" width="40" height="40">
      <div class="titles">
        <h1 id="title">Downloading stream…</h1>
        <div id="url"></div>
      </div>
    </div>
    <div id="info"></div>
    <progress id="bar" max="100" value="0"></progress>
    <div id="status">Starting…</div>
    <p id="note" hidden></p>
    <div class="actions"><button id="cancel">Cancel</button></div>
  </main>
  <script src="../lib/stream.js"></script>
  <script src="../lib/mux.js"></script>
  <script src="../lib/webm.js"></script>
  <script src="../lib/towebm.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
