<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Streamlift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="../icons/icon48.png" alt="" width="32" height="32">
    <div class="titles">
      <h1>Media on this page</h1>
      <p id="count" class="count">Looking for media…</p>
    </div>
    <button id="refresh" class="btn secondary tool ic-refresh" title="Scan the page again">Refresh</button>
    <button id="clear" class="btn secondary tool ic-trash" title="Remove all entries from this list">Clear</button>
  </header>
  <label class="opt" title="A small round button in the top-left corner of each video on the page. Click it to download that video.">
    <span class="opt-text">Show a download icon on videos<small>A small button in the corner of each video</small></span>
    <input type="checkbox" id="overlay" checked>
    <span class="switch" aria-hidden="true"></span>
  </label>
  <p id="msg" class="msg" hidden></p>
  <div id="empty" hidden>
    <div class="empty-art" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.2-2.5z" fill="currentColor"/></svg>
    </div>
    <p class="empty-title">No media detected yet</p>
    <p class="empty-text">Play the video or scroll the page, then press Refresh. If the page was open before the extension was installed, reload it first.</p>
  </div>
  <ul id="list"></ul>
  <footer class="credit">Streamlift &middot; built by <a href="https://github.com/tripathiprasun" target="_blank" rel="noopener noreferrer">Prasun Tripathi</a></footer>
  <script src="../lib/stream.js"></script>
  <script src="popup.js"></script>
</body>
</html>
